name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-safety:
    name: Source and secret safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject tracked secrets and local-only files
        shell: pwsh
        run: ./scripts/ci/check-secret-leaks.ps1

      - name: Confirm checkout starts clean
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

  android-quality:
    name: Android tests, Room, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FENIQO_STAGING_SUPABASE_URL: https://rxfaiynkhaxrksosxvxp.supabase.co
      FENIQO_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_staging_placeholder_not_a_credential
      FENIQO_RELEASE_ENVIRONMENT: production
      FENIQO_PRODUCTION_SUPABASE_URL: https://qgmymavltjnmfuzvfxiq.supabase.co
      FENIQO_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_release_placeholder_not_a_credential
      FENIQO_VERSION_CODE: "1"
      FENIQO_VERSION_NAME: 1.0.0-ci
    steps:
      - name: Checkout clean repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests, Room migrations, lint and debug build
        run: >-
          ./gradlew --no-daemon --stacktrace
          :sharedLogic:testAndroidHostTest
          :sharedUI:testAndroidHostTest
          :androidApp:testDebugUnitTest
          :androidApp:lintRelease
          :androidApp:assembleDebug

      - name: Reject uncommitted generated schema or source changes
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

  android-device:
    name: Android API 35 device release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FENIQO_STAGING_SUPABASE_URL: https://rxfaiynkhaxrksosxvxp.supabase.co
      FENIQO_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_staging_placeholder_not_a_credential
    steps:
      - name: Checkout clean repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Enable Gradle wrapper and KVM access
        run: |
          chmod +x gradlew
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run automated release tests on an Android API 35 managed device
        run: >-
          ./gradlew --no-daemon --stacktrace
          :androidApp:releaseGateApi35DebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=com.feniqo.mobile.data.local.database.EncryptedDatabaseIntegrationTest,com.feniqo.mobile.data.local.database.RoomMigrationChainInstrumentedTest,com.feniqo.mobile.platform.AndroidPlatformReleaseGateTest,com.feniqo.mobile.presentation.transaction.CustomSplitBoundaryAndLayoutAndroidTest,com.feniqo.mobile.presentation.transaction.CustomSplitMembershipDepartureAndroidTest,com.feniqo.mobile.presentation.transaction.TransactionScreenVisualTest

  release-gate:
    name: Offline demo and Android release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout clean repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Build offline demo without Supabase configuration
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDemo

      - name: Verify release fails closed without production configuration
        shell: bash
        run: |
          if ./gradlew --no-daemon :androidApp:validateProductionSupabaseConfiguration; then
            echo "Release validation unexpectedly accepted missing production configuration." >&2
            exit 1
          fi

      - name: Build unsigned release bundle with non-secret CI placeholders
        env:
          FENIQO_RELEASE_ENVIRONMENT: production
          FENIQO_PRODUCTION_SUPABASE_URL: https://qgmymavltjnmfuzvfxiq.supabase.co
          FENIQO_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_release_placeholder_not_a_credential
          FENIQO_VERSION_CODE: "1"
          FENIQO_VERSION_NAME: 1.0.0-ci
        run: >-
          ./gradlew --no-daemon --stacktrace
          :androidApp:bundleRelease

      - name: Verify minified release outputs exist
        run: >-
          test -s androidApp/build/outputs/bundle/release/androidApp-release.aab
          && test -s androidApp/build/outputs/mapping/release/mapping.txt

  ios-common:
    name: iOS common compile
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout clean repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Compile shared logic for iOS Simulator ARM64
        run: ./gradlew --no-daemon --stacktrace :sharedLogic:compileKotlinIosSimulatorArm64
